# Genera la extensión FFmpeg de Media3 (decodificador de audio por software: AC3, E-AC3, DTS, TrueHD, etc.)
# y la guarda en android/app/libs/ para que Gradle la incluya. Se ejecuta A MANO (Run workflow) y solo cuando
# cambie la versión de Media3 (build.gradle) o quieras actualizar FFmpeg. NO se ejecuta en cada compilación.
#
# ESTADO: escrito siguiendo la guía oficial de Media3 (libraries/decoder_ffmpeg/README.md) pero NO probado todavía.
# Es normal que necesite 1 o 2 ajustes en la primera ejecución: los pasos imprimen los datos necesarios para corregir.
name: FFmpeg para Media3 (genera el .aar)

on:
  workflow_dispatch:
    inputs:
      guardar_en_repo:
        description: "Guardar el .aar en android/app/libs/ del repositorio"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # DEBE coincidir con la versión de androidx.media3 en android/app/build.gradle (hoy 1.7.1)
  MEDIA3_TAG: "1.7.1"
  FFMPEG_BRANCH: "release/6.0"
  NDK_VERSION: "26.1.10909125"
  # Mismo valor que minSdk de la app
  MIN_API: "21"
  # Solo decodificadores de AUDIO (la lista que documenta Media3). Sin GPL ni "nonfree".
  ENABLED_DECODERS: "vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd"

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "NDK_PATH=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Descargar Media3 y FFmpeg
        run: |
          git clone --depth 1 --branch "${MEDIA3_TAG}" https://github.com/androidx/media.git media
          # FFmpeg: espejo oficial en GitHub (git.ffmpeg.org falla con frecuencia desde los servidores de Actions).
          # Hasta 3 intentos por si hay un corte momentáneo.
          for i in 1 2 3; do
            rm -rf media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg
            git clone --depth 1 --branch "${FFMPEG_BRANCH}" https://github.com/FFmpeg/FFmpeg.git \
              media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg && break
            echo "Intento $i falló; reintentando..."; sleep 15
            [ "$i" = 3 ] && { echo "::error::No se pudo descargar FFmpeg"; exit 1; }
          done

      - name: Comprobar que FFmpeg se compila SIN GPL
        working-directory: media/libraries/decoder_ffmpeg/src/main/jni
        run: |
          echo "--- primeras líneas de build_ffmpeg.sh (para depurar si cambia su uso) ---"
          sed -n 1,40p build_ffmpeg.sh
          if grep -qE -- '--enable-(gpl|nonfree|version3)' build_ffmpeg.sh; then
            echo "::error::build_ffmpeg.sh activa GPL/nonfree: no se puede distribuir con la app. Revisar."
            exit 1
          fi

      - name: Compilar FFmpeg (4 arquitecturas)
        working-directory: media/libraries/decoder_ffmpeg/src/main/jni
        run: |
          MODULE_PATH="$(cd .. && pwd)"
          # shellcheck disable=SC2086
          ./build_ffmpeg.sh "${MODULE_PATH}" "${NDK_PATH}" linux-x86_64 "${MIN_API}" ${ENABLED_DECODERS}

      - name: Compilar el .aar de Media3
        working-directory: media
        run: ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease

      - name: Localizar y verificar el .aar
        run: |
          AAR="$(find media/libraries/decoder_ffmpeg -name '*.aar' -path '*release*' | head -1)"
          test -n "$AAR" || { echo "::error::No se encontró el .aar"; find media/libraries/decoder_ffmpeg -name '*.aar'; exit 1; }
          echo "AAR=$AAR"
          unzip -l "$AAR" | grep -E 'libffmpegJNI\.so' || { echo "::error::El .aar no trae libffmpegJNI.so"; exit 1; }
          mkdir -p salida
          cp "$AAR" salida/media3-decoder-ffmpeg.aar
          cp media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/COPYING.LGPLv2.1 salida/FFMPEG-LICENCIA-LGPL-2.1.txt
          ls -la salida

      - uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-ffmpeg
          path: salida/

      - name: Guardar en el repositorio
        if: ${{ inputs.guardar_en_repo }}
        run: |
          mkdir -p android/app/libs
          cp salida/* android/app/libs/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/libs
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "FFmpeg para Media3 ${MEDIA3_TAG} (decodificador de audio por software)"
          git push
