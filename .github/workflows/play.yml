name: Construir APK de prueba (instalable en el teléfono)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
      PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
      PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar los secretos de la llave
        run: |
          for v in PLAY_KEYSTORE_BASE64 PLAY_KEYSTORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "FALTA el secreto $v (Settings > Secrets and variables > Actions > Secrets)"; exit 1; fi
          done

      - name: Descomprimir el proyecto (el zip más reciente)
        run: |
          ZIP=$(for f in E-Player-Play*.zip; do echo "$(git log -1 --format=%ct -- "$f")|$f"; done | sort -t'|' -k1,1n | tail -1 | cut -d'|' -f2-)
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d proyecto
          grep -q "productFlavors" proyecto/android/app/build.gradle || { echo "Este zip es anterior a la versión Play (v8)."; exit 1; }

      # NUEVO: el .aar de FFmpeg vive en la raíz del repo (android/app/libs/) y el proyecto se compila desde proyecto/android.
      - name: Añadir FFmpeg (decodificador de audio por software de Media3)
        run: |
          if ls android/app/libs/*.aar > /dev/null 2>&1; then
            mkdir -p proyecto/android/app/libs
            cp android/app/libs/* proyecto/android/app/libs/
            echo "FFmpeg añadido al proyecto:"
            ls -la proyecto/android/app/libs
          else
            echo "::warning::No hay .aar en android/app/libs/ del repositorio: el APK saldrá SIN FFmpeg."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK de Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Compilar la web de la app
        working-directory: proyecto/web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund qrcode-generator@1.4.4
          node scripts/build.js
          cp node_modules/qrcode-generator/qrcode.js public/qrcode.js

      - name: Copiar la web a la app
        run: |
          mkdir -p proyecto/android/app/src/main/assets
          cp -r proyecto/web/public/. proyecto/android/app/src/main/assets/
          rm -f proyecto/android/app/src/main/assets/sw.js

      - name: Compilar el APK (firmado con tu llave de subida, igual que el de Play)
        working-directory: proyecto/android
        run: |
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export PLAY_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          VC=$((GITHUB_RUN_NUMBER + 100))
          gradle assemblePlayRelease --no-daemon -PvCode=$VC
          rm -f "$RUNNER_TEMP/upload.jks"

      # NUEVO: comprobar que FFmpeg realmente quedó dentro del APK (si no, no tiene sentido instalarlo para esta prueba).
      - name: Verificar que el APK incluye FFmpeg
        run: |
          APK=proyecto/android/app/build/outputs/apk/play/release/app-play-release.apk
          if unzip -l "$APK" | grep -q 'libffmpegJNI\.so'; then
            echo "OK: el APK incluye FFmpeg:"
            unzip -l "$APK" | grep 'libffmpegJNI\.so'
          else
            echo "::error::El APK NO incluye libffmpegJNI.so (FFmpeg). Revisa que android/app/libs/media3-decoder-ffmpeg.aar exista en el repositorio."
            exit 1
          fi

      - name: Preparar el APK
        run: cp proyecto/android/app/build/outputs/apk/play/release/app-play-release.apk E-Player-prueba.apk

      - name: Publicar el APK de prueba en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: E-Player APK de prueba ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: E-Player-prueba.apk
