name: Construir versión Google Play (AAB)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  play:
    runs-on: ubuntu-24.04
    env:
      PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
      PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
      PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar los secretos de la llave de Play
        run: |
          for v in PLAY_KEYSTORE_BASE64 PLAY_KEYSTORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "FALTA el secreto $v (Settings > Secrets and variables > Actions > Secrets). Los valores están en SECRETOS-GITHUB-PLAY.txt"; exit 1; fi
          done

      - name: Descomprimir el proyecto
        run: |
          ZIP=$(for f in E-Player-Play*.zip; do echo "$(git log -1 --format=%ct -- "$f")|$f"; done | sort -t'|' -k1,1n | tail -1 | cut -d'|' -f2-)
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d proyecto
          grep -q "productFlavors" proyecto/android/app/build.gradle || { echo "Este zip es anterior a la versión Play (v8). Sube E-Player-Play-v1.zip."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK de Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Compilar la web de la app
        working-directory: proyecto/web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund qrcode-generator@1.4.4
          node scripts/build.js
          cp node_modules/qrcode-generator/qrcode.js public/qrcode.js

      - name: Copiar la web a la app
        run: |
          mkdir -p proyecto/android/app/src/main/assets
          cp -r proyecto/web/public/. proyecto/android/app/src/main/assets/
          rm -f proyecto/android/app/src/main/assets/sw.js

      - name: Compilar el AAB firmado para Google Play
        working-directory: proyecto/android
        run: |
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export PLAY_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          VC=$((GITHUB_RUN_NUMBER + 100))
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          gradle bundlePlayRelease --no-daemon -PvCode=$VC
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Preparar el AAB
        run: cp proyecto/android/app/build/outputs/bundle/playRelease/app-play-release.aab E-Player-play.aab

      - name: Guardar el AAB en Releases (privado)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-${{ github.run_number }}
          name: E-Player Google Play ${{ github.run_number }} (versionCode ${{ env.VERSION_CODE }})
          files: E-Player-play.aab
          make_latest: false
